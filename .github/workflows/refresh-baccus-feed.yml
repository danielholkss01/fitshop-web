name: Refresh Baccus product feed

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-baccus-feed
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check feed configuration
        id: feed
        env:
          AWIN_BACCUS_FEED_URL: ${{ secrets.AWIN_BACCUS_FEED_URL }}
        run: |
          if [ -z "$AWIN_BACCUS_FEED_URL" ]; then
            echo 'Add the AWIN_BACCUS_FEED_URL repository secret to enable the daily refresh.'
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.feed.outputs.enabled == 'true'
        with:
          persist-credentials: true

      - uses: actions/setup-node@v5
        if: steps.feed.outputs.enabled == 'true'
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        if: steps.feed.outputs.enabled == 'true'
        run: npm ci

      - name: Download approved Baccus CSV feed
        if: steps.feed.outputs.enabled == 'true'
        env:
          AWIN_BACCUS_FEED_URL: ${{ secrets.AWIN_BACCUS_FEED_URL }}
        run: |
          node --input-type=module <<'NODE'
          let url;
          try {
            url = new URL(process.env.AWIN_BACCUS_FEED_URL);
          } catch {
            throw new Error('The Baccus feed secret must contain a full HTTPS Awin download URL.');
          }
          if (url.protocol !== 'https:' || url.username || url.password ||
              !['datafeed.api.productserve.com', 'productdata.awin.com'].includes(url.hostname)) {
            throw new Error('The Baccus feed URL must come from Awin product data over HTTPS.');
          }
          NODE
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 2 --connect-timeout 15 --max-time 180 --max-filesize 104857600 \
            --output "$RUNNER_TEMP/baccus.csv.gz" "$AWIN_BACCUS_FEED_URL"
          gzip -t "$RUNNER_TEMP/baccus.csv.gz"

      - name: Refresh browseable products
        if: steps.feed.outputs.enabled == 'true'
        run: |
          npm run import:awin:discovery -- "$RUNNER_TEMP/baccus.csv.gz" \
            --advertiser-id 130505 --publisher-id 3111579 --audience men --feed-id 118153
          npm run test:awin
          npm run build

      - name: Publish updated catalog
        if: steps.feed.outputs.enabled == 'true'
        run: |
          git add src/lib/discovery-products.json
          if git diff --cached --quiet; then
            echo 'The catalog has not changed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh Baccus product listings'
          git push origin HEAD:main
